name: Release Linux Package Builds

on:
  push:
    tags:
      # Semantic version tags: v1.0.0, v2.1.3, etc.
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    uses: ./.github/workflows/linux-matrix-build.yml
    with:
      mode: package
      upload_artifacts: true
      artifact_name_prefix: consolation

  draft-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    needs: build-linux

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f -maxdepth 2 -print

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Consolation ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release-artifacts/*
